<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务器运维中</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    background: #0b0c0e; color: #f2f3f5;
    font: 16px/1.75 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    padding: 28px;
  }
  main { width: 100%; max-width: 560px; }
  .badge {
    display: inline-block; padding: 4px 11px; border: 1px solid #3a3d42; border-radius: 999px;
    font-size: 13px; letter-spacing: .12em; color: #9aa0a6;
  }
  h1 { margin: 18px 0 10px; font-size: 30px; line-height: 1.28; letter-spacing: .01em; }
  p { margin: 12px 0; color: #c7cbd1; }
  p.small { font-size: 14px; color: #868b92; }
  .bar { margin-top: 26px; height: 3px; border-radius: 999px; background: #1b1d21; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 38%; border-radius: 999px; background: #6d7378; }
  @media (prefers-reduced-motion: reduce) { .bar > i { width: 100%; } }
</style>
</head>
<body>
<main>
  <span class="badge">运 维 中</span>
  <h1>服务器运维中</h1>
  <p>这一页暂时停用 —— 我们正在维护服务器，维护完成后会恢复。</p>
  <p class="small">下面这些话是照实说的，不藏任何东西：</p>
  <p class="small">
    · 这一页只是<strong>用来查看</strong>的页面，它自己不产生、不转移任何链上资产；<br>
    · 已经发出去的币、金库里的钱、你的余额，<strong>都记在链上</strong>，与这个页面能不能打开<strong>无关</strong>；<br>
    · 维护期间<strong>不会</strong>有任何需要你签名的操作，任何让你"现在就签"的页面都不是我们做的。
  </p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <p class="small">给你带来不便，抱歉。</p>
</main>
</body>
</html>
